name: interngrow_ecommerce_app
description: "InternGrow Internship — E-Commerce Shopping App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1

  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  firebase_messaging: ^15.1.3

  dio: ^5.7.0
  cached_network_image: ^3.4.1

  shared_preferences: ^2.2.3
  google_sign_in: ^6.2.1

  form_field_validator: ^1.1.0
  url_strategy: ^0.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/